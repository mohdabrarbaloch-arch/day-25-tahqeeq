services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tahqeeq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tahqeeq_dev_password}
      POSTGRES_DB: tahqeeq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tahqeeq -d tahqeeq"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the app needs to reach it.
    expose:
      - "5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — generate one with: python -c "import secrets; print(secrets.token_urlsafe(48))"}
      DATABASE_URL: postgresql+psycopg://tahqeeq:${POSTGRES_PASSWORD:-tahqeeq_dev_password}@db:5432/tahqeeq
      BCRYPT_ROUNDS: "12"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      ALLOW_URL_FETCH: "true"
      ENABLE_DOCS: "false"
    ports:
      - "${PORT:-8000}:8000"

volumes:
  pgdata:
